<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
            
            .canvas { fill: #1F1408; }
            .grid-line { stroke: #38240D; stroke-width: 1; stroke-opacity: 0.6; }
            .neo-card { fill: #2A1A0B; stroke: #713600; stroke-width: 2.5; rx: 14; filter: drop-shadow(4px 4px 0px #0A0602); }
            .neo-btn { fill: #C05800; stroke: #38240D; stroke-width: 2; rx: 8; }
            .neo-pill { fill: #38230F; stroke: #713600; stroke-width: 1.5; rx: 999; }
            
            .t-title { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #FDFBD4; font-size: 20px; }
            .t-brand { font-family: 'Outfit', sans-serif; font-weight: 800; fill: #FDFBD4; font-size: 16px; letter-spacing: 0.05em; }
            .t-amber { fill: #C05800; font-weight: 700; }
            .t-cream { fill: #FDFBD4; }
            .t-sub { font-family: 'Plus Jakarta Sans', sans-serif; fill: #D8CAAE; font-size: 12px; }
            .t-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #FDFBD4; }
            .t-mono-amber { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #C05800; font-weight: 700; }
            
            /* Animations */
            @keyframes scanline {
                0% { transform: translateY(0); opacity: 0; }
                50% { opacity: 0.8; }
                100% { transform: translateY(540px); opacity: 0; }
            }
            .scan { animation: scanline 4s linear infinite; }
            
            @keyframes pulseDot {
                0%, 100% { opacity: 0.4; }
                50% { opacity: 1; filter: drop-shadow(0 0 6px #C05800); }
            }
            .pulse { animation: pulseDot 2s ease-in-out infinite; }

            /* Scenario Sequence (Looping 12s) */
            @keyframes step1User {
                0%, 10% { opacity: 0; transform: translateY(8px); }
                15%, 50% { opacity: 1; transform: translateY(0); }
                55%, 100% { opacity: 0; }
            }
            @keyframes step1Bot {
                0%, 18% { opacity: 0; transform: translateY(8px); }
                24%, 50% { opacity: 1; transform: translateY(0); }
                55%, 100% { opacity: 0; }
            }
            @keyframes step1Hud {
                0%, 20% { opacity: 0; }
                25%, 50% { opacity: 1; }
                55%, 100% { opacity: 0; }
            }

            @keyframes step2User {
                0%, 55% { opacity: 0; transform: translateY(8px); }
                60%, 95% { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; }
            }
            @keyframes step2Bot {
                0%, 65% { opacity: 0; transform: translateY(8px); }
                72%, 95% { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; }
            }
            @keyframes step2Hud {
                0%, 68% { opacity: 0; }
                74%, 95% { opacity: 1; }
                100% { opacity: 0; }
            }

            .s1-u { animation: step1User 12s ease-in-out infinite; }
            .s1-b { animation: step1Bot 12s ease-in-out infinite; }
            .s1-h { animation: step1Hud 12s ease-in-out infinite; }

            .s2-u { animation: step2User 12s ease-in-out infinite; }
            .s2-b { animation: step2Bot 12s ease-in-out infinite; }
            .s2-h { animation: step2Hud 12s ease-in-out infinite; }
        </style>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E06C05"/>
            <stop offset="100%" stop-color="#C05800"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="540" class="canvas"/>

    <!-- Subtle Spatial Grid Lines -->
    <g class="grid-line">
        <line x1="0" y1="60" x2="960" y2="60"/>
        <line x1="0" y1="120" x2="960" y2="120"/>
        <line x1="0" y1="180" x2="960" y2="180"/>
        <line x1="0" y1="240" x2="960" y2="240"/>
        <line x1="0" y1="300" x2="960" y2="300"/>
        <line x1="0" y1="360" x2="960" y2="360"/>
        <line x1="0" y1="420" x2="960" y2="420"/>
        <line x1="0" y1="480" x2="960" y2="480"/>
        <line x1="120" y1="0" x2="120" y2="540"/>
        <line x1="240" y1="0" x2="240" y2="540"/>
        <line x1="360" y1="0" x2="360" y2="540"/>
        <line x1="480" y1="0" x2="480" y2="540"/>
        <line x1="600" y1="0" x2="600" y2="540"/>
        <line x1="720" y1="0" x2="720" y2="540"/>
        <line x1="840" y1="0" x2="840" y2="540"/>
    </g>

    <!-- Top Laser Scanline -->
    <line x1="0" y1="0" x2="960" y2="0" stroke="#C05800" stroke-width="2" class="scan" opacity="0.6"/>

    <!-- Top Command Navigation Bar -->
    <rect x="24" y="16" width="912" height="54" class="neo-card"/>
    <g transform="translate(42, 28)">
        <!-- Logo Glyph -->
        <polygon points="14,2 26,22 19,22 14,14 9,22 2,22" fill="#C05800" stroke="#38240D" stroke-width="1.5"/>
        <circle cx="14" cy="18" r="1.5" fill="#FDFBD4"/>
        <text x="34" y="21" class="t-brand">AXIOM <tspan class="t-amber" font-size="11" font-family="JetBrains Mono">SOVEREIGN RAG</tspan></text>
        
        <!-- Status Badges -->
        <rect x="560" y="4" width="138" height="24" class="neo-pill"/>
        <circle cx="574" cy="16" r="4" fill="#C05800" class="pulse"/>
        <text x="586" y="20" class="t-mono" font-size="10">pgvector 16 · Online</text>

        <rect x="710" y="4" width="168" height="24" class="neo-pill"/>
        <text x="722" y="20" class="t-mono" font-size="10">Honesty Gate: Armed</text>
    </g>

    <!-- Split Studio Layout: Left (Copilot Studio) / Right (Grounding HUD) -->
    <!-- LEFT CARD: Interactive Copilot -->
    <rect x="24" y="86" width="536" height="430" class="neo-card"/>
    <g transform="translate(44, 108)">
        <text x="0" y="14" class="t-title" font-size="16">Copilot Sandbox</text>
        <text x="0" y="34" class="t-sub">Zero-hallucination inference directly from verified company documents.</text>
        
        <!-- Studio Deck Tabs -->
        <rect x="0" y="48" width="190" height="30" fill="#1F1408" stroke="#713600" stroke-width="1.5" rx="8"/>
        <rect x="3" y="51" width="90" height="24" fill="#C05800" rx="6"/>
        <text x="18" y="67" class="t-mono" font-size="10" font-weight="700">Chat</text>
        <text x="110" y="67" class="t-mono" font-size="10" fill="#9E886D">Upload Ingest</text>

        <!-- Scenario 1: Broadband Question & Grounded Answer -->
        <g class="s1-u">
            <rect x="180" y="94" width="316" height="36" fill="#C05800" stroke="#38240D" stroke-width="2" rx="10" filter="drop-shadow(2px 2px 0px #0A0602)"/>
            <text x="194" y="117" class="t-mono" font-size="11" fill="#FDFBD4">What is the broadband reimbursement?</text>
        </g>
        <g class="s1-b">
            <rect x="0" y="142" width="496" height="96" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="10" filter="drop-shadow(2px 2px 0px #0A0602)"/>
            <text x="16" y="166" class="t-mono" font-size="11" fill="#FDFBD4">Employees who work remotely full-time are eligible</text>
            <text x="16" y="186" class="t-mono" font-size="11" fill="#FDFBD4">for a monthly broadband internet stipend of <tspan fill="#C05800" font-weight="700">$75 USD</tspan>,</text>
            <text x="16" y="206" class="t-mono" font-size="11" fill="#FDFBD4">reimbursed automatically on regular payroll cycles.</text>
            <text x="16" y="226" class="t-mono-amber" font-size="10">Source: sample_acme_policy.pdf · Page 1 (Remote Work)</text>
        </g>

        <!-- Scenario 2: Apple Pie Trick Question & Honesty Gate Refusal -->
        <g class="s2-u">
            <rect x="150" y="94" width="346" height="36" fill="#C05800" stroke="#38240D" stroke-width="2" rx="10" filter="drop-shadow(2px 2px 0px #0A0602)"/>
            <text x="164" y="117" class="t-mono" font-size="11" fill="#FDFBD4">What is grandma's apple pie recipe?</text>
        </g>
        <g class="s2-b">
            <rect x="0" y="142" width="496" height="96" fill="#381717" stroke="#EF4444" stroke-width="2" rx="10" filter="drop-shadow(2px 2px 0px #0A0602)"/>
            <text x="16" y="168" class="t-mono" font-size="11" fill="#EF4444" font-weight="700">Deterministic Honesty Gate Triggered (Score: -10.85)</text>
            <text x="16" y="192" class="t-mono" font-size="11" fill="#FDFBD4">I do not have verified information about apple pie recipes</text>
            <text x="16" y="212" class="t-mono" font-size="11" fill="#FDFBD4">in your corporate documents. Hallucination halted.</text>
        </g>

        <!-- Chat Prompt Chips -->
        <g transform="translate(0, 260)">
            <rect x="0" y="0" width="130" height="26" class="neo-pill"/>
            <text x="12" y="17" class="t-mono" font-size="9.5">Broadband Stipend</text>
            <rect x="140" y="0" width="126" height="26" class="neo-pill"/>
            <text x="152" y="17" class="t-mono" font-size="9.5">Leave Limits Table</text>
            <rect x="276" y="0" width="126" height="26" class="neo-pill"/>
            <text x="288" y="17" class="t-mono" font-size="9.5">Wellness Benefit</text>
            <rect x="412" y="0" width="84" height="26" class="neo-pill" stroke="#C05800"/>
            <text x="424" y="17" class="t-mono-amber" font-size="9.5">Honesty Gate</text>
        </g>

        <!-- Chat Input Field -->
        <g transform="translate(0, 310)">
            <rect x="0" y="0" width="410" height="42" fill="#1F1408" stroke="#713600" stroke-width="2" rx="10"/>
            <text x="16" y="25" class="t-mono" fill="#9E886D" font-size="11">Ask any question about company policies...</text>
            <rect x="420" y="0" width="76" height="42" class="neo-btn"/>
            <text x="438" y="25" class="t-mono" font-weight="700" fill="#FDFBD4" font-size="11">Inquire</text>
        </g>
    </g>

    <!-- RIGHT CARD: Grounding & Telemetry HUD -->
    <rect x="580" y="86" width="356" height="430" class="neo-card"/>
    <g transform="translate(602, 108)">
        <text x="0" y="14" class="t-title" font-size="16">Grounding &amp; Telemetry HUD</text>
        <text x="0" y="34" class="t-sub">Real-time mathematical relevance telemetry.</text>

        <!-- Metric Gauges (Scenario 1 vs Scenario 2) -->
        <!-- S1 HUD: PASS -->
        <g class="s1-h">
            <g transform="translate(0, 52)">
                <rect x="0" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="10" y="18" class="t-mono" font-size="9" fill="#9E886D">TOP RELEVANCE</text>
                <text x="10" y="42" class="t-title" font-size="18" fill="#C05800">+8.92</text>

                <rect x="162" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="172" y="18" class="t-mono" font-size="9" fill="#9E886D">HONESTY GATE</text>
                <text x="172" y="42" class="t-title" font-size="18" fill="#10B981">PASS</text>
            </g>
            <g transform="translate(0, 114)">
                <rect x="0" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="10" y="18" class="t-mono" font-size="9" fill="#9E886D">RETRIEVED CHUNKS</text>
                <text x="10" y="42" class="t-title" font-size="18" fill="#FDFBD4">6 Passages</text>

                <rect x="162" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="172" y="18" class="t-mono" font-size="9" fill="#9E886D">TTFT LATENCY</text>
                <text x="172" y="42" class="t-title" font-size="18" fill="#FDFBD4">~85ms</text>
            </g>
        </g>

        <!-- S2 HUD: REFUSED -->
        <g class="s2-h">
            <g transform="translate(0, 52)">
                <rect x="0" y="0" width="150" height="54" fill="#381717" stroke="#EF4444" stroke-width="1.5" rx="8"/>
                <text x="10" y="18" class="t-mono" font-size="9" fill="#D8CAAE">TOP RELEVANCE</text>
                <text x="10" y="42" class="t-title" font-size="18" fill="#EF4444">-10.85</text>

                <rect x="162" y="0" width="150" height="54" fill="#381717" stroke="#EF4444" stroke-width="1.5" rx="8"/>
                <text x="172" y="18" class="t-mono" font-size="9" fill="#D8CAAE">HONESTY GATE</text>
                <text x="172" y="42" class="t-title" font-size="18" fill="#EF4444">REFUSED</text>
            </g>
            <g transform="translate(0, 114)">
                <rect x="0" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="10" y="18" class="t-mono" font-size="9" fill="#9E886D">RETRIEVED CHUNKS</text>
                <text x="10" y="42" class="t-title" font-size="18" fill="#FDFBD4">0 Valid</text>

                <rect x="162" y="0" width="150" height="54" fill="#38230F" stroke="#713600" stroke-width="1.5" rx="8"/>
                <text x="172" y="18" class="t-mono" font-size="9" fill="#9E886D">BLOCK LATENCY</text>
                <text x="172" y="42" class="t-title" font-size="18" fill="#FDFBD4">18ms</text>
            </g>
        </g>

        <!-- Pipeline Execution Flow Trace -->
        <text x="0" y="196" class="t-mono-amber" font-size="10">PIPELINE EXECUTION TRACE</text>
        <rect x="0" y="206" width="312" height="152" fill="#140C04" stroke="#523414" stroke-width="1.5" rx="8"/>
        <g transform="translate(14, 226)">
            <text x="0" y="0" class="t-mono" font-size="10.5">1. Query Vectorization <tspan fill="#C05800">[768-d]</tspan></text>
            <text x="0" y="24" class="t-mono" font-size="10.5">2. Dense Cosine Search <tspan fill="#9E886D">[HNSW]</tspan></text>
            <text x="0" y="48" class="t-mono" font-size="10.5">3. Lexical Search <tspan fill="#9E886D">[Postgres BM25]</tspan></text>
            <text x="0" y="72" class="t-mono" font-size="10.5">4. RRF Rank Fusion <tspan fill="#9E886D">(k=60)</tspan></text>
            <text x="0" y="96" class="t-mono" font-size="10.5">5. Cross-Encoder Rescore <tspan fill="#C05800">[MiniLM]</tspan></text>
            <text x="0" y="120" class="t-mono" font-size="10.5">6. Honesty Threshold Check <tspan fill="#C05800">[-9.50]</tspan></text>
        </g>
    </g>
</svg>

